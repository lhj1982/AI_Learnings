global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "ai-api"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "api:8000"
  - job_name: "vllm"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:8001"