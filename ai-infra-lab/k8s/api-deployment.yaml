apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-api
  namespace: ai-infra

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-api

  template:
    metadata:
      labels:
        app: ai-api

    spec:
      containers:
        - name: ai-api
          image: ai-infra-api:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: LLM_PROVIDER
              value: "local"
            - name: LLM_BASE_URL
              value: "http://host.minikube.internal:8001/v1"

            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-1.5B-Instruct"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-api-secrets
                  key: LLM_API_KEY

            - name: DEEPSEEK_BASE_URL
              value: "https://api.deepseek.com"

            - name: DEEPSEEK_MODEL
              value: "deepseek-flash"

            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-api-secrets
                  key: DEEPSEEK_API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"